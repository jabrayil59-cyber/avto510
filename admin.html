<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avto510 — Admin Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #181c27;
    --card:      #1e2333;
    --border:    #2a3045;
    --accent:    #3b82f6;
    --accent-h:  #2563eb;
    --danger:    #ef4444;
    --success:   #22c55e;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --input-bg:  #131720;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 1.1rem; font-weight: 600; letter-spacing: -.3px; }
  .logo span { color: var(--accent); }

  /* ── Layout ── */
  .layout { display: flex; min-height: calc(100vh - 56px); }

  nav {
    width: 200px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 1.5rem 0;
    flex-shrink: 0;
  }
  nav button {
    display: flex;
    align-items: center;
    gap: .6rem;
    width: 100%;
    padding: .65rem 1.5rem;
    background: none;
    border: none;
    color: var(--muted);
    font-size: .875rem;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: color .15s, background .15s;
  }
  nav button:hover { color: var(--text); background: rgba(255,255,255,.04); }
  nav button.active { color: var(--accent); background: rgba(59,130,246,.1); border-right: 2px solid var(--accent); }

  main { flex: 1; padding: 2rem; overflow-x: hidden; }

  /* ── Tabs ── */
  .tab { display: none; }
  .tab.active { display: block; }

  h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; }

  /* ── Cards ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .card h3 { font-size: .95rem; font-weight: 600; margin-bottom: 1.2rem; color: var(--muted); text-transform: uppercase; font-size: .75rem; letter-spacing: .05em; }

  /* ── Form ── */
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-group { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .8rem; }
  label { font-size: .8rem; color: var(--muted); }
  input, select, textarea {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: .875rem;
    padding: .55rem .8rem;
    outline: none;
    transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--card); }

  /* ── Buttons ── */
  .btn {
    padding: .55rem 1.2rem;
    border-radius: 6px;
    border: none;
    font-family: inherit;
    font-size: .875rem;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-h); }
  .btn-danger  { background: var(--danger);  color: #fff; }
  .btn-danger:hover { background: #dc2626; }
  .btn-sm { padding: .3rem .7rem; font-size: .78rem; }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th { text-align: left; padding: .6rem .8rem; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
  td { padding: .65rem .8rem; border-bottom: 1px solid rgba(42,48,69,.6); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }

  .badge {
    display: inline-block;
    padding: .2rem .55rem;
    border-radius: 4px;
    font-size: .75rem;
    background: rgba(59,130,246,.15);
    color: var(--accent);
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    padding: .7rem 1.2rem;
    border-radius: 8px;
    font-size: .875rem;
    font-weight: 500;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .25s, transform .25s;
    z-index: 999;
    pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateY(0); }
  #toast.ok  { background: var(--success); color: #fff; }
  #toast.err { background: var(--danger);  color: #fff; }

  /* ── Empty state ── */
  .empty { text-align: center; padding: 2.5rem; color: var(--muted); font-size: .875rem; }

  @media (max-width: 640px) {
    .form-row { grid-template-columns: 1fr; }
    nav { width: 56px; }
    nav button span.nav-label { display: none; }
    main { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">Avto<span>510</span> Admin</div>
  <div style="font-size:.8rem;color:var(--muted)">idarəetmə paneli</div>
</header>

<div class="layout">
  <nav>
    <button class="active" onclick="switchTab('categories', this)">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
      <span class="nav-label">Kateqoriyalar</span>
    </button>
    <button onclick="switchTab('products', this)">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-1.5 6h11"/></svg>
      <span class="nav-label">Məhsullar</span>
    </button>
  </nav>

  <main>

    <!-- ══ KATEQORİYALAR ══ -->
    <div id="tab-categories" class="tab active">
      <h2>Kateqoriya idarəsi</h2>

      <div class="card">
        <h3>Yeni kateqoriya</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Kateqoriya adı *</label>
            <input type="text" id="cat-name" placeholder="məs: Mühərrik hissələri">
          </div>
          <div class="form-group">
            <label>Üst kateqoriya (opsional)</label>
            <select id="cat-parent">
              <option value="">— Yoxdur (əsas kateqoriya) —</option>
            </select>
          </div>
        </div>
        <div class="form-row single">
          <div class="form-group">
            <label>Şəkil URL (opsional)</label>
            <input type="text" id="cat-image" placeholder="https://...">
          </div>
        </div>
        <button class="btn btn-primary" onclick="saveCategory()">Kateqoriya əlavə et</button>
      </div>

      <div class="card">
        <h3>Mövcud kateqoriyalar</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Ad</th><th>Üst kateqoriya</th><th>Əməliyyat</th></tr></thead>
            <tbody id="cat-table-body"><tr><td colspan="4" class="empty">Yüklənir...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ══ MƏHSULLAR ══ -->
    <div id="tab-products" class="tab">
      <h2>Məhsul idarəsi</h2>

      <div class="card">
        <h3>Yeni məhsul</h3>
        <div class="form-row">
          <div class="form-group">
            <label>Məhsul adı *</label>
            <input type="text" id="prod-name" placeholder="məs: Yağ filteri VAZ 2107">
          </div>
          <div class="form-group">
            <label>Kateqoriya *</label>
            <select id="prod-category"></select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Qiymət (AZN) *</label>
            <input type="number" id="prod-price" placeholder="0.00" min="0" step="0.01">
          </div>
          <div class="form-group">
            <label>Stok miqdarı</label>
            <input type="number" id="prod-stock" placeholder="0" min="0">
          </div>
        </div>
        <div class="form-row single">
          <div class="form-group">
            <label>Şəkil URL (opsional)</label>
            <input type="text" id="prod-image" placeholder="https://...">
          </div>
        </div>
        <div class="form-row single">
          <div class="form-group">
            <label>Açıqlama</label>
            <textarea id="prod-desc" placeholder="Məhsul haqqında qısa məlumat..."></textarea>
          </div>
        </div>
        <button class="btn btn-primary" onclick="saveProduct()">Məhsul əlavə et</button>
      </div>

      <div class="card">
        <h3>Mövcud məhsullar</h3>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Ad</th><th>Kateqoriya</th><th>Qiymət</th><th>Stok</th><th>Əməliyyat</th></tr></thead>
            <tbody id="prod-table-body"><tr><td colspan="6" class="empty">Yüklənir...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

  </main>
</div>

<div id="toast"></div>

<script>
const API_CAT  = 'categories.php';
const API_PROD = 'products.php';

// ── Tab keçidi ──
function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ── Toast ──
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  setTimeout(() => t.className = '', 2800);
}

// ══════════════════════════════
//  KATEQORİYALAR
// ══════════════════════════════
async function loadCategories() {
  const res  = await fetch(API_CAT);
  const cats = await res.json();

  // Cədvəl
  const tbody = document.getElementById('cat-table-body');
  if (!cats.length) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty">Hələ kateqoriya yoxdur</td></tr>';
  } else {
    const catMap = Object.fromEntries(cats.map(c => [c.id, c.name]));
    tbody.innerHTML = cats.map(c => `
      <tr>
        <td><span class="badge">${c.id}</span></td>
        <td>${c.name}</td>
        <td>${c.parent_id ? catMap[c.parent_id] || '—' : '—'}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteCategory(${c.id})">Sil</button></td>
      </tr>`).join('');
  }

  // Seçim siyahıları
  const opts = cats.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('cat-parent').innerHTML = '<option value="">— Yoxdur —</option>' + opts;
  document.getElementById('prod-category').innerHTML = '<option value="">Kateqoriya seçin</option>' + opts;
}

async function saveCategory() {
  const name = document.getElementById('cat-name').value.trim();
  if (!name) { toast('Ad daxil edin', 'err'); return; }

  const body = {
    name,
    parent_id: document.getElementById('cat-parent').value || null,
    image:     document.getElementById('cat-image').value.trim()
  };

  const res  = await fetch(API_CAT, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();

  if (data.success) {
    toast('✓ Kateqoriya əlavə edildi');
    document.getElementById('cat-name').value  = '';
    document.getElementById('cat-image').value = '';
    loadCategories();
  } else {
    toast(data.error || 'Xəta baş verdi', 'err');
  }
}

async function deleteCategory(id) {
  if (!confirm('Bu kateqoriyanı silmək istəyirsiniz?')) return;
  const res  = await fetch(API_CAT, { method: 'DELETE', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
  const data = await res.json();
  if (data.success) { toast('Kateqoriya silindi'); loadCategories(); }
  else toast(data.error || 'Xəta', 'err');
}

// ══════════════════════════════
//  MƏHSULLAR
// ══════════════════════════════
async function loadProducts() {
  const res      = await fetch(API_PROD);
  const products = await res.json();
  const tbody    = document.getElementById('prod-table-body');

  if (!products.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty">Hələ məhsul yoxdur</td></tr>';
  } else {
    tbody.innerHTML = products.map(p => `
      <tr>
        <td><span class="badge">${p.id}</span></td>
        <td>${p.name}</td>
        <td>${p.category_name || '—'}</td>
        <td>${parseFloat(p.price).toFixed(2)} ₼</td>
        <td>${p.stock}</td>
        <td><button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})">Sil</button></td>
      </tr>`).join('');
  }
}

async function saveProduct() {
  const name        = document.getElementById('prod-name').value.trim();
  const category_id = document.getElementById('prod-category').value;
  const price       = document.getElementById('prod-price').value;

  if (!name)        { toast('Məhsul adı daxil edin', 'err'); return; }
  if (!category_id) { toast('Kateqoriya seçin', 'err'); return; }
  if (!price)       { toast('Qiymət daxil edin', 'err'); return; }

  const body = {
    name, category_id: parseInt(category_id),
    price:       parseFloat(price),
    stock:       parseInt(document.getElementById('prod-stock').value) || 0,
    description: document.getElementById('prod-desc').value.trim(),
    image:       document.getElementById('prod-image').value.trim()
  };

  const res  = await fetch(API_PROD, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json();

  if (data.success) {
    toast('✓ Məhsul əlavə edildi');
    ['prod-name','prod-price','prod-stock','prod-image','prod-desc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('prod-category').selectedIndex = 0;
    loadProducts();
  } else {
    toast(data.error || 'Xəta baş verdi', 'err');
  }
}

async function deleteProduct(id) {
  if (!confirm('Bu məhsulu silmək istəyirsiniz?')) return;
  const res  = await fetch(API_PROD, { method: 'DELETE', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ id }) });
  const data = await res.json();
  if (data.success) { toast('Məhsul silindi'); loadProducts(); }
  else toast(data.error || 'Xəta', 'err');
}

// ── Başlanğıc yükləmə ──
loadCategories();
loadProducts();
</script>
</body>
</html>
